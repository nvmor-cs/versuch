<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Lumora – Training &amp; Gesundheit</title>
  <meta name="description" content="Lumora: Übungen, Pläne, Workout-Tracking und Fortschritt – offline und privat auf deinem Gerät.">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumora">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main>
      <!-- Die Beschriftungen setzt js/app.js in der eingestellten Sprache
           nach (siehe bildschirmBeschriften) – hier steht die Ausgangslage. -->
      <section class="screen active" id="screen-home" data-label="Start"></section>
      <section class="screen" id="screen-plans" data-label="Pläne"></section>
      <section class="screen" id="screen-exercises" data-label="Übungen"></section>
      <section class="screen" id="screen-history" data-label="Verlauf"></section>
      <!-- Ernährung: eigene Welt, eigener Speicher (js/essen.js) -->
      <section class="screen" id="screen-food-day" data-label="Ernährung heute"></section>
      <section class="screen" id="screen-food-lib" data-label="Lebensmittel"></section>
      <section class="screen" id="screen-food-hist" data-label="Ernährung im Verlauf"></section>
      <!-- Gesundheit: Körper, Kalender, Balance (js/gesundheit.js) -->
      <section class="screen" id="screen-health-body" data-label="Körper"></section>
      <section class="screen" id="screen-health-cal" data-label="Trainingskalender"></section>
      <section class="screen" id="screen-health-muscle" data-label="Balance der Muskelgruppen"></section>
    </main>
    <nav class="tabbar" id="tabbar" data-label="Hauptnavigation">
      <div class="bereich-punkte" id="bereich-punkte" data-label="Bereich wechseln"></div>
      <div class="tabbar-inner" id="tabbar-inner"></div>
    </nav>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/muscle-paths.js"></script>
  <script src="js/muscle-icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/essen.js"></script>
  <script src="js/gesundheit.js"></script>
  <script src="js/einstieg.js"></script>
  <script>
    // Service Worker nur registrieren, wenn er verfügbar ist (nicht in der Artifact-Version)
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
