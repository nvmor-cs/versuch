<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Lumora – Training &amp; Gesundheit</title>
  <meta name="description" content="Lumora: Übungen, Pläne, Workout-Tracking und Fortschritt – offline und privat auf deinem Gerät.">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumora">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main>
      <section class="screen active" id="screen-home" aria-label="Start"></section>
      <section class="screen" id="screen-plans" aria-label="Pläne"></section>
      <section class="screen" id="screen-exercises" aria-label="Übungen"></section>
      <section class="screen" id="screen-history" aria-label="Verlauf"></section>
    </main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <div class="tabbar-inner" id="tabbar-inner"></div>
    </nav>
  </div>
  <script src="js/exercises.js"></script>
  <script src="js/muscle-icons.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker nur registrieren, wenn er verfügbar ist (nicht in der Artifact-Version)
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
